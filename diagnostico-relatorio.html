<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu Relatório | Diagnóstico Financeiro HZ Invest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #F6F4EE; font-family: 'Manrope', sans-serif; color: #15153F; }
  a { color: #3E6F69; }
  a:hover { color: #1B1B5C; }
  ::selection { background: rgba(111,168,160,0.35); }

  .btn-print { position: fixed; top: 20px; right: 20px; z-index: 999; background: #1B1B5C; color: #FBFAF6; border: none; border-radius: 6px; padding: 12px 20px; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer; letter-spacing: 0.02em; }
  .btn-print:hover { background: #2A2A6E; }

  section { padding: 80px 32px 88px; }
  section.tight { padding: 56px 32px 72px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  .wrap-wide { max-width: 900px; margin: 0 auto; }
  .hairline { border-top: 1px solid rgba(27,27,92,0.1); }

  .eyebrow-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .eyebrow-line { width: 48px; height: 2px; background: #4F8C84; flex-shrink: 0; }
  .eyebrow-text { font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #3E6F69; flex: 1; }
  .section-num { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: rgba(21,21,63,0.3); font-feature-settings: 'tnum'; flex-shrink: 0; }
  h2 { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 500; color: #1B1B5C; margin: 0 0 32px; }

  .navy-glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(111,168,160,0.35) 0%, rgba(111,168,160,0) 70%); pointer-events: none; }
  .card { background: #FBFAF6; border: 1px solid rgba(27,27,92,0.14); border-radius: 8px; }

  .kpi-label { font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(21,21,63,0.45); margin-bottom: 6px; }
  .kpi-small { font-size: 16px; color: #1B1B5C; font-weight: 600; }
  .kpi-med { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; color: #1B1B5C; font-feature-settings: 'tnum'; }

  .cover { position: relative; overflow: hidden; background: #1B1B5C; color: #FBFAF6; min-height: 92vh; display: flex; flex-direction: column; justify-content: space-between; }
  .cover-title { font-family: 'Fraunces', serif; font-size: 52px; font-weight: 500; line-height: 1.12; }

  /* Gráfico da projeção: a caixa define a proporção (mais alta no celular) e
     os rótulos são HTML, então o texto não encolhe junto com o desenho. */
  .grafico { position: relative; width: 100%; padding-bottom: 41.7%; }
  .g-rot { position: absolute; font-size: 10.5px; line-height: 1.2; white-space: nowrap; pointer-events: none; }
  .g-rot-eixo { color: rgba(21,21,63,0.55); font-weight: 500; }
  .g-rot-meta { color: #A9762F; font-weight: 700; }
  .g-rot-marco { color: rgba(21,21,63,0.6); font-weight: 700; }
  .g-rot-alerta { color: #B34747; font-weight: 700; }

  @media (max-width: 639px) {
    section { padding: 56px 20px 64px; }
    section.tight { padding: 44px 20px 56px; }
    .cover-title { font-size: 36px; }
    h2 { font-size: 26px; }
    .grafico { padding-bottom: 78%; }
    .g-rot { font-size: 10px; }
    /* Cartão-âncora em cima dos secundários, e rosca em cima da legenda:
       lado a lado, os dois espremem a coluna da direita a ponto de os
       rótulos quebrarem letra a letra. */
    .kpi-grupo-corpo { grid-template-columns: 1fr !important; }
    .dist-card { flex-direction: column; align-items: stretch !important; gap: 22px !important; }
    .dist-card > div:first-child { align-self: center; }
    .dist-lista { grid-template-columns: 1fr !important; }
  }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .card, .kpi, .dim-row, .glossary-item, .faixa-row, .kpi-grupo { break-inside: avoid; }
    /* O bloco do arquétipo pode passar de uma página inteira quando o cliente
       escreve bastante nas perguntas abertas. Mantê-lo inteiro empurraria o
       bloco todo pra folha seguinte e deixaria o título da seção sozinho, então
       aqui ele continua na próxima página em vez de ser preservado. */
    .archetype-block { break-inside: auto; }
    @page { size: A4; margin: 16mm; }

    /* Capa e encerramento ganham páginas sem margem, pra o fundo navy sangrar
       até a borda do papel. O padding volta por dentro, em mm, já que aqui não
       há viewport. */
    @page sangria { margin: 0; }
    .cover, .closing { page: sangria; min-height: 0; height: 100vh; padding: 24mm 22mm; }
    .closing { break-before: page; display: flex; flex-direction: column; justify-content: center; }

    /* Uma seção por página: cada uma recomeça no topo da folha seguinte. O
       respiro vertical entre seções vem da margem da folha, então o padding
       sai — inclusive o de baixo, que o navegador tenta manter junto com o
       último bloco e acabava empurrando blocos inteiros pra página seguinte. */
    #report > section:not(.cover):not(.closing) { break-before: page; padding-top: 0; padding-bottom: 0; }
    /* Os fios separadores só fazem sentido quando as seções se seguem na
       mesma folha; com a quebra, viram um risco solto no topo da página. */
    .hairline { border-top: none; }
  }
</style>
</head>
<body>
<button class="btn-print no-print" onclick="window.print()">Baixar PDF</button>
<div id="report"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=3"></script>
<script src="diagnostico-core.js?v=2"></script>
<script>
"use strict";

// Lógica de cálculo compartilhada (diagnostico-core.js)
var fmt = HZDiag.fmt, pct = HZDiag.pct, esc = HZDiag.esc, computeReport = HZDiag.computeReport;

/* ===================== Render ===================== */
function sectionHeader(eyebrow, num, title) {
  return '<div class="eyebrow-wrap"><div class="eyebrow-line"></div><div class="eyebrow-text">' + eyebrow + '</div><div class="section-num">' + num + ' · 14</div></div>' +
    '<h2>' + title + '</h2>';
}

/* ── Seção 7: Distribuição de Despesas ────────────────────────────────────
   Duas leituras na mesma página. A rosca reparte a despesa por categoria
   (fecha em 100%); a régua compara com a referência 50/30/20, que é sobre a
   renda.

   Cor: onze categorias com onze matizes distintos reprovam nos testes de
   daltonismo e de contraste — passam só três matizes quando todos os pares
   precisam se distinguir. Então a identidade fica no grupo (essenciais em
   azul, flexíveis em ocre) e, dentro de cada grupo, os passos variam em
   claridade na ordem de tamanho. A lista ao lado nomeia cada fatia com seu
   percentual, que é o alívio exigido para os tons de contraste mais baixo. */
var RAMPA = {
  essenciais: ["#25397A", "#2C4794", "#3454A8", "#4667BB", "#6180C9", "#8098D6", "#A3B4E3"],
  flexiveis:  ["#9E6B14", "#BE8320", "#D99A2B", "#E8B45E"],
  investimentos: "#1F8F7A"
};

function corDaCategoria(cat, indiceNoGrupo) {
  var rampa = RAMPA[cat.grupo] || RAMPA.essenciais;
  return rampa[Math.min(indiceNoGrupo, rampa.length - 1)];
}

function renderDistribuicao(R) {
  var d = R.distribuicao;

  // A régua não é identidade, é estado: cada faixa é uma razão medida contra um
  // limite. Por isso a barra usa a cor de estado — e vem sempre com a frase que
  // diz o mesmo, pra não depender de cor em impressão preto e branco.
  var COMENTARIO = {
    essenciais: { ok: "Dentro da faixa geralmente considerada saudável.",
                  fora: "Acima da faixa geralmente considerada saudável — vale ver se há espaço pra reduzir algum desses gastos fixos." },
    flexiveis:  { ok: "Dentro da faixa geralmente considerada saudável.",
                  fora: "Acima da faixa geralmente considerada saudável — é aqui que os cortes costumam ser mais fáceis." },
    investimentos: { ok: "Dentro (ou acima) da faixa geralmente considerada saudável.",
                     fora: "Abaixo da faixa geralmente considerada saudável — é o que mais pesa no longo prazo." }
  };

  var faixas = d.faixas.map(function (f) {
    var cor = f.dentro ? "#3E6F69" : "#C48A3E";
    var largura = Math.max(0, Math.min(100, f.pct));
    var rotulo = f.limite === "ate" ? "ideal até " + f.ideal + "%" : "ideal no mínimo " + f.ideal + "%";
    var texto = COMENTARIO[f.key][f.dentro ? "ok" : "fora"];
    return '<div class="faixa-row" style="margin-bottom:18px;">' +
      '<div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:5px;">' +
      '<div style="font-size:14.5px; font-weight:700; color:#1B1B5C;">' + f.nome + '</div>' +
      '<div style="font-size:13px; font-weight:700; color:' + cor + '; font-feature-settings:\'tnum\';">' + pct(f.pct, 1) +
      ' <span style="color:rgba(21,21,63,0.4); font-weight:500;">(' + rotulo + ')</span></div></div>' +
      '<div style="position:relative; height:9px; border-radius:4.5px; background:rgba(27,27,92,0.08); margin-bottom:6px;">' +
      '<div style="width:' + largura + '%; height:100%; background:' + cor + '; border-radius:4.5px;"></div>' +
      '<div style="position:absolute; top:-3px; left:' + f.ideal + '%; width:2px; height:15px; background:#1B1B5C;"></div>' +
      '</div>' +
      '<div style="font-size:12px; color:rgba(21,21,63,0.55); line-height:1.5;">' + f.itens + ' ' + texto + '</div>' +
      '</div>';
  }).join("");

  var referencia =
    '<div style="font-size:13.5px; line-height:1.7; color:rgba(21,21,63,0.7); max-width:620px; margin-bottom:16px;">' +
    'Uma referência comum de planejamento sugere até 50% da renda em despesas essenciais, até 30% em despesas flexíveis, ' +
    'e pelo menos 20% direcionado a investimentos e reserva — a lógica do "50/30/20". É um ponto de partida, não uma regra: ' +
    'serve pra mostrar onde vale ajustar primeiro.</div>';

  var cabecalho =
    sectionHeader("Para onde vai o dinheiro", "07", "Distribuição de Despesas");

  var bloco2 =
    '<div style="font-size:10.5px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:#3E6F69; margin:26px 0 10px;">Referência</div>' +
    '<div style="font-family:\'Fraunces\', serif; font-size:19px; font-weight:500; color:#1B1B5C; margin-bottom:10px;">O que seria uma distribuição equilibrada</div>' +
    referencia +
    '<div class="card" style="padding:22px 28px;">' + faixas + '</div>';

  if (!d.categorias.length) {
    return '<section class="hairline"><div class="wrap">' + cabecalho +
      '<div style="font-size:13.5px; line-height:1.6; color:rgba(21,21,63,0.7); margin-bottom:6px;">Você não detalhou as despesas por categoria, então não há distribuição a mostrar. A régua abaixo usa os totais informados.</div>' +
      bloco2 + '</div></section>';
  }

  // ---- rosca ----
  // Onze categorias com onze matizes distintos reprovam nos testes de daltonismo
  // (só três matizes se distinguem quando qualquer par pode ser comparado). Então
  // a identidade fica no grupo — essenciais em azul, flexíveis em ocre — e dentro
  // de cada grupo os passos variam em claridade, na ordem de tamanho. A lista ao
  // lado nomeia cada fatia com o percentual, que é o alívio exigido.
  var RAIO = 60, LARGURA = 24, C = 2 * Math.PI * RAIO;
  var acumulado = 0, vistos = {};
  var arcos = d.categorias.map(function (c) {
    var i = (vistos[c.grupo] = (vistos[c.grupo] || 0)); vistos[c.grupo]++;
    var comprimento = (c.pct / 100) * C;
    var traco = Math.max(comprimento - 2, 0.8);   // 2px de respiro entre fatias
    var el = '<circle cx="80" cy="80" r="' + RAIO + '" fill="none" stroke="' + corDaCategoria(c, i) +
      '" stroke-width="' + LARGURA + '" stroke-dasharray="' + traco.toFixed(2) + ' ' + (C - traco).toFixed(2) +
      '" stroke-dashoffset="' + (-acumulado).toFixed(2) + '" />';
    acumulado += comprimento;
    return el;
  }).join("");

  vistos = {};
  var lista = d.categorias.map(function (c) {
    var i = (vistos[c.grupo] = (vistos[c.grupo] || 0)); vistos[c.grupo]++;
    return '<div style="display:flex; align-items:center; gap:8px; padding:5px 0;">' +
      '<div style="width:9px; height:9px; border-radius:50%; background:' + corDaCategoria(c, i) + '; flex-shrink:0;"></div>' +
      '<div style="font-size:12.5px; color:rgba(21,21,63,0.8); flex:1; min-width:0;">' + c.label + '</div>' +
      '<div style="font-size:12.5px; font-weight:700; color:#1B1B5C; font-feature-settings:\'tnum\';">' + pct(c.pct, 1) + '</div>' +
      '</div>';
  }).join("");

  return '<section class="hairline"><div class="wrap">' + cabecalho +
    '<div style="font-size:13.5px; line-height:1.6; color:rgba(21,21,63,0.6); max-width:580px; margin-bottom:18px;">' +
    'Como os ' + fmt(d.total) + ' que saem por mês se repartem entre as categorias. ' +
    'Aqui os percentuais são sobre a despesa; na régua abaixo, sobre a renda.</div>' +
    '<div class="card dist-card" style="padding:26px 30px; display:flex; gap:32px; align-items:center;">' +
    '<div style="position:relative; width:176px; height:176px; flex-shrink:0;">' +
    '<svg width="176" height="176" viewBox="0 0 160 160" role="img" aria-label="Distribuição das despesas por categoria, total de ' + fmt(d.total) + '.">' +
    '<circle cx="80" cy="80" r="' + RAIO + '" fill="none" stroke="rgba(27,27,92,0.08)" stroke-width="' + LARGURA + '" />' +
    '<g transform="rotate(-90 80 80)">' + arcos + '</g></svg>' +
    '<div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;">' +
    '<div style="font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:rgba(21,21,63,0.4);">Total</div>' +
    '<div style="font-family:\'Fraunces\', serif; font-size:18px; font-weight:500; color:#1B1B5C; font-feature-settings:\'tnum\';">' + fmt(d.total) + '</div>' +
    '</div></div>' +
    '<div class="dist-lista" style="flex:1; display:grid; grid-template-columns:repeat(2, 1fr); gap:6px 20px;">' + lista + '</div>' +
    '</div>' + bloco2 + '</div></section>';
}

function renderReport(R) {
  var html = "";

  // 1. Capa
  html += '<section class="cover">' +
    '<div class="navy-glow" style="top:-120px; right:-120px; width:420px; height:420px;"></div>' +
    '<div style="position:relative; display:flex; align-items:center; justify-content:space-between;">' +
    '<div style="font-family:\'Fraunces\', serif; font-size:20px; font-weight:600;">HZ <span style="font-style:italic; color:#6FA8A0;">Invest</span></div>' +
    '<div style="font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#6FA8A0;">Diagnóstico Financeiro</div></div>' +
    '<div style="position:relative; max-width:640px;">' +
    '<div style="display:flex; align-items:center; gap:12px; margin-bottom:24px;"><div style="width:48px; height:2px; background:#6FA8A0;"></div>' +
    '<div style="font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#6FA8A0;">Relatório Personalizado</div></div>' +
    '<div class="cover-title">' + esc(R.data.nome) + '</div>' +
    '<div style="margin-top:20px; font-size:16px; color:rgba(251,250,246,0.7);">' + R.dataFormatada + '</div></div>' +
    '<div style="position:relative; font-size:12.5px; color:rgba(251,250,246,0.5);">Documento educacional e orientativo · HZ Invest Consultoria de Investimentos</div>' +
    '</section>';

  // 2. Abertura
  html += '<section><div class="wrap">' +
    sectionHeader("Antes de começar", "02", "Bem-vindo(a) ao seu diagnóstico, " + esc(R.data.primeiroNome) + ".") +
    '<div style="font-size:16.5px; line-height:1.75; color:rgba(21,21,63,0.75); max-width:640px;">' +
    '<p>Este relatório traduz tudo o que você compartilhou conosco em um retrato claro e honesto da sua vida financeira hoje, sem jargão e sem julgamento.</p>' +
    '<p>Nas próximas páginas você vai encontrar: seu score geral e nível de maturidade financeira, seu perfil comportamental, os números centrais da sua situação, o desempenho em cada uma das 6 dimensões avaliadas, a projeção do seu patrimônio até a aposentadoria (quanto você precisa ter, quanto precisa guardar por mês e o que o ritmo atual entrega), e um plano de ação individualizado, com uma lista prática para os próximos 30 dias.</p>' +
    '<p>Este é um retrato do momento, não uma sentença. Toda situação financeira pode evoluir com clareza e direção certas.</p>' +
    '</div></div></section>';

  // 3. Score geral
  var insight = "";
  if (R.insightPercepcao.show) {
    insight = '<div style="margin-top:24px; background:rgba(196,138,62,0.1); border:1px solid rgba(196,138,62,0.3); border-radius:8px; padding:20px 24px;">' +
      '<div style="font-size:11px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:#C48A3E; margin-bottom:10px;">Percepção x Realidade</div>' +
      R.insightPercepcao.itens.map(function (d) { return '<div style="font-size:14px; line-height:1.65; color:rgba(21,21,63,0.8); margin-bottom:8px;">' + d + '</div>'; }).join("") +
      '</div>';
  }
  html += '<section class="tight hairline"><div class="wrap">' +
    sectionHeader("Onde você está", "03", "Score Geral e Nível de Maturidade") +
    '<div class="card" style="padding:44px; display:flex; align-items:center; gap:48px; flex-wrap:wrap;">' +
    '<div style="flex:0 0 auto;"><svg width="160" height="160" viewBox="0 0 160 160">' +
    '<circle cx="80" cy="80" r="68" fill="none" stroke="rgba(27,27,92,0.12)" stroke-width="14" />' +
    '<circle cx="80" cy="80" r="68" fill="none" stroke="#4F8C84" stroke-width="14" stroke-linecap="round" stroke-dasharray="' + R.gaugeDash + '" stroke-dashoffset="' + R.gaugeOffset + '" transform="rotate(-90 80 80)" />' +
    '<text x="80" y="88" text-anchor="middle" font-family="Fraunces, serif" font-size="42" font-weight="500" fill="#1B1B5C">' + R.scoreGeral + '</text>' +
    '</svg></div>' +
    '<div style="flex:1 1 260px; min-width:240px;">' +
    '<div style="font-size:11px; font-weight:700; letter-spacing:0.18em; text-transform:uppercase; color:#3E6F69; margin-bottom:8px;">Nível ' + R.nivel.n + ' · ' + R.nivel.nome + '</div>' +
    '<div style="font-size:15.5px; line-height:1.7; color:rgba(21,21,63,0.75);">' + R.nivel.contexto + '</div>' +
    '</div></div>' + insight + '</div></section>';

  // 4. Resumo do perfil
  html += '<section class="tight hairline"><div class="wrap">' +
    sectionHeader("Contexto", "04", "Resumo do Perfil") +
    '<div class="card" style="padding:40px;">' +
    '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:24px 32px; margin-bottom:28px;">' +
    '<div><div class="kpi-label">Idade</div><div class="kpi-small">' + esc(R.data.idade) + ' anos</div>' +
      (R.data.nascimentoDisplay ? '<div style="font-size:12px; color:rgba(21,21,63,0.60); margin-top:4px;">Nascimento: ' + esc(R.data.nascimentoDisplay) + '</div>' : "") + '</div>' +
    '<div><div class="kpi-label">Estado civil</div><div class="kpi-small">' + esc(R.data.estadoCivil) + '</div>' +
      (R.data.nascimentoConjugeDisplay ? '<div style="font-size:12px; color:rgba(21,21,63,0.60); margin-top:4px;">Cônjuge nascido em ' + esc(R.data.nascimentoConjugeDisplay) + '</div>' : "") + '</div>' +
    '<div><div class="kpi-label">Filhos/dependentes</div><div class="kpi-small">' + esc(R.data.filhos) + '</div></div>' +
    '<div><div class="kpi-label">Ocupação</div><div class="kpi-small">' + esc(R.data.ocupacao) + '</div></div>' +
    '</div>' +
    '<div style="height:1px; background:rgba(27,27,92,0.14); margin:8px 0 28px;"></div>' +
    '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:24px 32px;">' +
    '<div><div class="kpi-label">Renda total mensal</div><div class="kpi-med">' + R.kpis.rendaTotalDisplay + '</div></div>' +
    '<div><div class="kpi-label">Patrimônio total</div><div class="kpi-med">' + R.kpis.patrimonioTotalDisplay + '</div></div>' +
    '</div>' +
    '<div style="height:1px; background:rgba(27,27,92,0.14); margin:28px 0;"></div>' +
    '<div class="kpi-label" style="margin-bottom:14px;">Metas declaradas</div>' +
    R.metasDeclaradas.map(function (m) {
      return '<div style="display:flex; gap:12px; margin-bottom:10px; align-items:baseline;">' +
        '<div style="font-family:\'Fraunces\', serif; font-style:italic; color:#3E6F69; flex-shrink:0;">—</div>' +

  if (stored && stored.data && stored.data.nome) {
    container.innerHTML = renderReport(computeReport(stored.data, stored.geradoEm));
    if (window.hzSupabase && hzSupabase.configurado()) {
      hzSupabase.enviarDiagnostico().then(function () { return hzSupabase.enviarRelatorio(); });
    }
  } else {
    document.querySelector(".btn-print").style.display = "none";
    container.innerHTML = renderEmpty();
  }
})();
</script>
