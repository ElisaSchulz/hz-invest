<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico Financeiro | HZ Invest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #F6F4EE; font-family: 'Manrope', sans-serif; color: #15153F; min-height: 100vh; display: flex; flex-direction: column; }
  ::selection { background: rgba(111,168,160,0.35); }
  input::placeholder, textarea::placeholder { color: rgba(21,21,63,0.35); }
  select { -webkit-appearance: none; appearance: none; }
  textarea { resize: vertical; }
  button { font-family: 'Manrope', sans-serif; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 28px 64px; border-bottom: 1px solid rgba(27,27,92,0.14); }
  .brand { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; color: #1B1B5C; letter-spacing: 0.01em; text-decoration: none; }
  .brand em { font-style: italic; color: #3E6F69; font-weight: 500; }
  .topbar-label { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); text-align: right; }

  .stepper { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 16px 12px; border-bottom: 1px solid rgba(27,27,92,0.14); flex-wrap: wrap; }
  .step-cell { display: flex; align-items: center; gap: 4px; }
  .step-node { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; font-feature-settings: 'tnum'; flex-shrink: 0; }
  .step-node.active { background: #1B1B5C; color: #FBFAF6; border: 1px solid #1B1B5C; }
  .step-node.done { background: transparent; color: #3E6F69; border: 1px solid #4F8C84; }
  .step-node.todo { background: transparent; color: rgba(21,21,63,0.35); border: 1px solid rgba(27,27,92,0.2); }
  .step-line { width: 14px; height: 1px; background: rgba(27,27,92,0.2); }

  .main { padding: 56px 24px 80px; flex: 1; display: flex; justify-content: center; }
  .container { width: 100%; max-width: 760px; }

  .hero { position: relative; overflow: hidden; background: #1B1B5C; border-radius: 8px; color: #FBFAF6; padding: 72px 64px; }
  .hero-glow { position: absolute; top: -60px; right: -60px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(111,168,160,0.35) 0%, rgba(111,168,160,0) 70%); pointer-events: none; }
  .hero-eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; position: relative; }
  .hero-eyebrow-line { width: 48px; height: 2px; background: #6FA8A0; flex-shrink: 0; }
  .hero-eyebrow-text { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #6FA8A0; }
  .hero-title { font-family: 'Fraunces', serif; font-size: 44px; line-height: 1.15; font-weight: 500; max-width: 560px; position: relative; }
  .hero-title em { font-style: italic; color: #6FA8A0; }
  .hero-sub { margin-top: 28px; font-size: 15.5px; line-height: 1.7; color: rgba(251,250,246,0.75); max-width: 520px; position: relative; }
  .entregaveis { margin-top: 40px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 32px; max-width: 560px; position: relative; }
  .entregavel { display: flex; gap: 10px; align-items: baseline; }
  .entregavel-dash { font-family: 'Fraunces', serif; font-style: italic; color: #6FA8A0; font-size: 15px; flex-shrink: 0; }
  .entregavel-text { font-size: 14.5px; line-height: 1.5; color: rgba(251,250,246,0.9); }
  .cta-wrap { margin-top: 40px; display: flex; flex-direction: row; align-items: center; gap: 28px; flex-wrap: wrap; position: relative; }
  .btn-cta { background: #FBFAF6; color: #1B1B5C; border: none; border-radius: 6px; padding: 16px 32px; font-weight: 700; font-size: 15px; cursor: pointer; letter-spacing: 0.01em; }
  .btn-cta:hover { background: #6FA8A0; color: #FBFAF6; }
  .cta-note { font-size: 13px; color: rgba(251,250,246,0.55); line-height: 1.5; }

  .step-eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .step-eyebrow-line { width: 48px; height: 2px; background: #4F8C84; flex-shrink: 0; }
  .step-eyebrow-text { font-size: 12px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #3E6F69; }
  .step-title { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 500; color: #1B1B5C; margin-bottom: 10px; }
  .step-desc { font-size: 15px; color: rgba(21,21,63,0.6); margin-bottom: 28px; max-width: 560px; line-height: 1.6; }

  .card { background: #FBFAF6; border: 1px solid rgba(27,27,92,0.14); border-radius: 8px; padding: 40px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .grid2.tight { gap: 20px; }
  .span2 { grid-column: span 2; }
  .grid1 { display: grid; grid-template-columns: 1fr; gap: 24px; }

  .f-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
  .f-input { width: 100%; padding: 13px 14px; border: 1px solid rgba(27,27,92,0.2); border-radius: 6px; font-family: 'Manrope', sans-serif; font-size: 15px; color: #15153F; background: #FBFAF6; }
  .f-input:focus { outline: none; border-color: #3E6F69; }
  .f-input:disabled { opacity: 0.6; }
  .f-input.num { font-feature-settings: 'tnum'; }
  .f-hint { font-size: 12.5px; color: rgba(21,21,63,0.5); margin-top: 8px; }

  .rule { grid-column: span 2; height: 1px; background: rgba(27,27,92,0.14); margin: 4px 0 8px; }
  .rule-full { height: 1px; background: rgba(27,27,92,0.14); margin: 28px 0; }

  .seg { display: inline-flex; border: 1px solid rgba(27,27,92,0.2); border-radius: 6px; overflow: hidden; }
  .seg.full { width: 100%; }
  .seg button { padding: 12px 22px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; background: transparent; color: rgba(21,21,63,0.55); }
  .seg button + button { border-left: 1px solid rgba(27,27,92,0.2); }
  .seg button.on { background: #1B1B5C; color: #FBFAF6; }
  .seg.stretch button { flex: 1; padding: 13px 10px; font-size: 13px; }

  .totalizer { position: relative; overflow: hidden; background: #1B1B5C; border-radius: 8px; padding: 24px 28px; color: #FBFAF6; margin-bottom: 28px; }
  .totalizer.flat { margin-bottom: 0; }
  .totalizer-glow { position: absolute; top: -30px; right: -30px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(111,168,160,0.35) 0%, rgba(111,168,160,0) 70%); pointer-events: none; }
  .totalizer-label { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #6FA8A0; margin-bottom: 8px; position: relative; }
  .totalizer-value { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 500; font-feature-settings: 'tnum'; position: relative; }

  .list-item { border: 1px solid rgba(27,27,92,0.14); border-radius: 8px; padding: 20px; margin-bottom: 14px; }
  .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .list-title { font-size: 13px; font-weight: 700; color: #1B1B5C; }
  .link-remove { background: transparent; border: none; color: var(--faint); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline; }
  .link-add { display: inline-block; margin-top: 4px; background: transparent; border: none; color: #3E6F69; font-size: 14px; font-weight: 700; cursor: pointer; padding: 0; }
  .link-edit { background: transparent; border: 1px solid rgba(27,27,92,0.25); color: #1B1B5C; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 6px 14px; border-radius: 5px; }

  .review-card { margin-bottom: 20px; }
  .review-title { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 500; color: #1B1B5C; }
  .review-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
  .review-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(21,21,63,0.4); margin-bottom: 3px; }
  .review-value { font-size: 14.5px; color: #15153F; line-height: 1.5; }
  .confirm-banner { background: #1B1B5C; border-radius: 8px; padding: 28px 32px; color: #FBFAF6; font-size: 14.5px; line-height: 1.6; }

  .error-msg { text-align: right; font-size: 13px; color: #B34747; margin-bottom: 10px; line-height: 1.6; }
  .footer-nav { display: flex; flex-direction: row; justify-content: space-between; align-items: center; margin-top: 36px; }
  .btn-back { background: transparent; border: none; color: rgba(21,21,63,0.55); font-weight: 600; font-size: 14px; cursor: pointer; padding: 12px 4px; }
  .btn-continue { border: none; border-radius: 6px; padding: 16px 36px; font-weight: 700; font-size: 15px; cursor: pointer; background: #1B1B5C; color: #FBFAF6; }
  .btn-continue.blocked { background: rgba(27,27,92,0.35); color: rgba(251,250,246,0.85); }

  .done-hero { text-align: center; }
  .done-title { font-family: 'Fraunces', serif; font-style: italic; font-size: 28px; color: #6FA8A0; margin-bottom: 16px; position: relative; }
  .done-text { font-size: 16px; line-height: 1.7; color: rgba(251,250,246,0.8); max-width: 460px; margin: 0 auto; position: relative; }
  .done-actions { margin-top: 32px; position: relative; }
  .btn-report { display: inline-block; background: #FBFAF6; color: #1B1B5C; text-decoration: none; border-radius: 6px; padding: 16px 32px; font-weight: 700; font-size: 15px; }
  .btn-report:hover { background: #6FA8A0; color: #FBFAF6; }
  .link-restart { display: block; margin-top: 18px; font-size: 13px; color: rgba(251,250,246,0.55); background: none; border: none; cursor: pointer; text-decoration: underline; margin-left: auto; margin-right: auto; position: relative; }

  .gasto-slider-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .gasto-slider-box span { font-size: 14px; color: rgba(21,21,63,0.6); }
  .check-label { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: rgba(21,21,63,0.55); cursor: pointer; }

  @media (max-width: 639px) {
    .topbar { padding: 16px 20px; }
    .topbar-label { font-size: 9px; letter-spacing: 0.14em; }
    .step-node { width: 22px; height: 22px; font-size: 10px; }
    .step-line { width: 8px; }
    .main { padding: 28px 18px 56px; }
    .hero { padding: 36px 24px; }
    .hero-title { font-size: 28px; }
    .entregaveis { grid-template-columns: 1fr; }
    .cta-wrap { flex-direction: column; align-items: stretch; gap: 16px; }
    .btn-cta { width: 100%; text-align: center; }
    .step-title { font-size: 26px; }
    .card { padding: 24px 20px; }
    .grid2, .review-grid { grid-template-columns: 1fr; }
    .span2, .rule { grid-column: auto; }
    .seg-wrap-mobile .seg { width: 100%; }
    .seg-wrap-mobile .seg button { flex: 1; }
    .footer-nav { flex-direction: column-reverse; gap: 12px; margin-top: 28px; }
    .btn-continue { width: 100%; }
    .error-msg { text-align: left; }
  }

  /* ── controle de acesso ── */
  .gate {
    position: fixed;
    inset: 0;
    z-index: 500;
    background: #F6F4EE;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .gate[hidden] { display: none; }
  .gate-box {
    max-width: 460px;
    width: 100%;
    text-align: center;
    background: #FBFAF6;
    border: 1px solid rgba(27,27,92,0.14);
    border-radius: 12px;
    padding: 40px 32px;
  }
  .gate-spinner {
    width: 28px; height: 28px;
    margin: 0 auto 20px;
    border: 2px solid rgba(27,27,92,0.15);
    border-top-color: #3E6F69;
    border-radius: 50%;
    animation: gate-gira 0.8s linear infinite;
  }
  .gate-spinner[hidden] { display: none; }
  @keyframes gate-gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .gate-spinner { animation-duration: 2.4s; }
  }
  .gate-titulo {
    font-family: 'Fraunces', serif;
    font-size: 24px; font-weight: 500; color: #1B1B5C;
    margin: 0 0 12px;
  }
  .gate-msg { font-size: 15px; line-height: 1.65; color: rgba(21,21,63,0.68); margin: 0 0 8px; }
  .gate-msg + .gate-msg { margin-top: 12px; }
  .gate-acoes { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  .gate-btn {
    display: inline-flex; align-items: center; justify-content: center;
    background: #1B1B5C; color: #FBFAF6;
    font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 15px;
    text-decoration: none; border-radius: 6px; padding: 14px 24px;
    border: none; cursor: pointer;
  }
  .gate-btn:hover { background: #3E6F69; }
  .gate-btn.sec {
    background: transparent; color: #1B1B5C;
    border: 1px solid rgba(27,27,92,0.2);
  }
  .gate-btn.sec:hover { background: rgba(79,140,132,0.1); color: #1B1B5C; }
  .gate-nota { font-size: 13px; color: rgba(21,21,63,0.58); margin-top: 20px; line-height: 1.6; }
  .gate-nota a { color: #3E6F69; }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html">HZ <em>Invest</em></a>
  <div class="topbar-label">Diagnóstico Financeiro</div>
</div>

<div class="stepper" id="stepper" style="display:none;"></div>

<div class="main">
  <div class="container" id="app"></div>
</div>

<!-- ─────────────────────────────────────────────────────────────
     Controle de acesso. Fica visível por padrão e sai da frente
     assim que a compra é confirmada, para o questionário nunca
     aparecer antes da verificação.
     Para desligar durante o desenvolvimento, troque
     HZ_EXIGIR_COMPRA para false no script logo abaixo.
     ───────────────────────────────────────────────────────────── -->
<div class="gate" id="acessoGate">
  <div class="gate-box">
    <div class="gate-spinner" id="gateSpinner" aria-hidden="true"></div>
    <div id="gateConteudo">
      <p class="gate-msg">Verificando seu acesso…</p>
    </div>
  </div>
</div>

(function restore() {
  try {
    var saved = JSON.parse(localStorage.getItem(STORAGE_FORM) || "null");
    if (saved && saved.data) {
      data = Object.assign(defaultData(), saved.data);
      data.despesas = Object.assign(defaultData().despesas, saved.data.despesas || {});
      step = typeof saved.step === "number" ? saved.step : 0;
    }
  } catch (e) { /* dados corrompidos: começa do zero */ }
})();

function persist() {
  try { localStorage.setItem(STORAGE_FORM, JSON.stringify({ step: step, data: data })); } catch (e) {}
}

/* ===================== Helpers ===================== */
function fmt(value) {
  var n = Number(value) || 0;
  return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(n);
}
function esc(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function parseCents(raw) {
  var digits = String(raw).replace(/\D/g, "");
  return digits === "" ? 0 : parseInt(digits, 10) / 100;
}

/* ===================== Datas de nascimento ===================== */
// A idade usada em todos os cálculos vem da data de nascimento de quem responde.
// A data do cônjuge é apenas informativa: não entra em nenhuma conta.
function idadeDeData(iso) {
  if (window.HZDiag && HZDiag.idadeEm) return HZDiag.idadeEm(iso);
  return null;
}
function idadeAtual() {
  var calc = idadeDeData(data.dataNascimento);
  if (calc !== null) return calc;
  var legado = Number(data.idade);
  return legado > 0 ? legado : null;
}
function dataBR(iso) {
  if (window.HZDiag && HZDiag.formatarData) return HZDiag.formatarData(iso);
  return iso || "";
}
function dataMaxNascimento() {
  return new Date().toISOString().slice(0, 10);
}
// Quantos anos de acumulação sobram entre a idade de hoje e a idade-alvo.
function hintPrazoAposentadoria() {
  var idadeHoje = idadeAtual();
  var idadeAlvo = Number(data.idadeAposentadoria) || 0;
  if (idadeHoje === null || idadeAlvo <= 0) return "";
  var anos = idadeAlvo - idadeHoje;
  if (anos <= 0) return '<div class="f-hint">Você já está na idade que informou, então não há fase de acumulação: o relatório vai avaliar quanto o patrimônio atual sustenta.</div>';
  return '<div class="f-hint">Você tem ' + anos + (anos === 1 ? " ano" : " anos") + " pra acumular, dos " + idadeHoje + " aos " + idadeAlvo + ".</div>";
}
function idadeHint(iso, rotulo) {
  var a = idadeDeData(iso);
  if (iso && a === null) return '<div class="f-hint" style="color:var(--red);">Data inválida.</div>';
  if (a === null) return "";
  return '<div class="f-hint">' + (rotulo || "Idade") + ": " + a + (a === 1 ? " ano" : " anos") + "</div>";
}

/* ===================== Totais ===================== */
function totals() {
  var totalRenda = (data.rendaPropria || 0) + (data.temConjuge === true ? (data.rendaConjuge || 0) : 0) + data.outrasRendas.reduce(function (a, r) { return a + (r.valor || 0); }, 0);
  var totalDespesas = DESPESA_CATEGORIES.reduce(function (a, c) { return a + (data.despesas[c[0]] || 0); }, 0);
  var patrimonioImoveis = data.imoveis.reduce(function (a, i) { return a + (i.valorMercado || 0); }, 0);
  var patrimonioVeiculos = data.veiculos.reduce(function (a, i) { return a + (i.valor || 0); }, 0);
  var patrimonioInvest = INVEST_FIELDS.reduce(function (a, f) { return a + (data[f[0]] || 0); }, 0);
  var patrimonioTotal = patrimonioImoveis + patrimonioVeiculos + patrimonioInvest;
  var saldosFinanciamento = data.imoveis.concat(data.veiculos).reduce(function (a, i) { return a + (i.status === "financiado" ? (i.saldoDevedor || 0) : 0); }, 0);
  var totalDividas = data.temDividas === true ? (data.cartaoCredito || 0) + (data.chequeEspecial || 0) + (data.emprestimoPessoal || 0) + data.outrasDividas.reduce(function (a, d) { return a + (d.valor || 0); }, 0) : 0;
  var patrimonioLiquido = patrimonioTotal - saldosFinanciamento - totalDividas;
  var gastoEstimado = totalRenda * ((data.gastoPercent || 0) / 100);
  return { totalRenda: totalRenda, totalDespesas: totalDespesas, patrimonioTotal: patrimonioTotal, patrimonioLiquido: patrimonioLiquido, totalDividas: totalDividas, gastoEstimado: gastoEstimado };
}

function updateTotalizers() {
  var t = totals();
  var map = { "tot-renda": t.totalRenda, "tot-despesas": t.totalDespesas, "tot-patrimonio": t.patrimonioTotal, "tot-liquido": t.patrimonioLiquido, "tot-dividas": t.totalDividas };
  Object.keys(map).forEach(function (id) {
    var el = document.getElementById(id);
    if (el) el.textContent = fmt(map[id]);
  });
  var gastoLabel = document.getElementById("gasto-estimado-label");
  if (gastoLabel) gastoLabel.textContent = "~ " + fmt(t.gastoEstimado) + " (" + data.gastoPercent + "% da renda)";
}

/* ===================== Validação ===================== */
function requiredByStep(n) {
  var t = totals();
  var req = {
    1: [
      ["Nome completo", data.nome.trim() !== ""],
      ["E-mail", /\S+@\S+\.\S+/.test(data.email)],
      ["Estado", data.estado !== ""],
      ["Cidade", data.cidade.trim() !== ""],
      ["Data de nascimento", idadeAtual() !== null],
      ["Estado civil", data.estadoCivil !== ""],
      ["Tem cônjuge com renda própria?", data.temConjuge === true || data.temConjuge === false],
      ["Filhos / dependentes", String(data.filhos) !== ""],
      ["Ocupação", data.ocupacao !== ""],
      ["Aceite da Política de Privacidade", data.consentimento === true]
    ],
    2: [["Renda mensal (informe ao menos uma fonte)", t.totalRenda > 0]],
    3: [["Despesas mensais (informe ao menos uma categoria)", t.totalDespesas > 0]],
    4: [
      ["Perfil de risco autodeclarado", data.perfilRisco !== ""],
      ["Sabe a rentabilidade média no último ano?", data.sabeRentabilidade !== ""],
      ["Investe automático ou só o que sobra?", data.investeAutomatico !== ""]
    ],
    5: [["Você tem dívidas em cartão de crédito, cheque especial ou empréstimo pessoal hoje?", data.temDividas === true || data.temDividas === false]],
    6: [
      ["Onde está aplicada", data.ondeAplicada !== ""],
      ["Tempo sem se desesperar", data.tempoSemRenda !== ""]
    ],
    7: [
      ["Tem seguro de vida?", data.temSeguroVida === true || data.temSeguroVida === false],
      ["Tem plano de saúde?", data.temPlanoSaude === true || data.temPlanoSaude === false],
      ["Tempo com renda garantida", data.tempoRendaGarantida !== ""],
      [rotuloRevisao(), !(data.temSeguroVida === true || data.temPlanoSaude === true) || data.revisouApolices !== ""]
    ],
    8: [
      ["Idade em que quer se aposentar", String(data.idadeAposentadoria) !== ""],
      ["Renda mensal desejada na aposentadoria", data.gastoNaoSei === true || (data.gastoMensalAposentadoria || 0) > 0],
      ["O que fazer com o patrimônio na aposentadoria", data.estrategiaAposentadoria !== ""],
      ["Idade até quando a renda precisa durar", data.estrategiaAposentadoria !== "consumo" || (Number(data.idadeFimRenda) || 0) > (Number(data.idadeAposentadoria) || 0)],
      ["Metas financeiras definidas", data.temMetasDefinidas !== ""],
      ["Já calculou quanto guardar", data.calculouQuantoGuardar !== ""]
    ],
    9: [
      ["O salário/renda cobre todas as despesas?", data.salarioCobre === true || data.salarioCobre === false],
      ["Sobra, empata ou fica no vermelho", data.sobraEmpataVermelho !== ""],
      ["Sabe pra onde vai o dinheiro", data.sabeParaOndeVaiDinheiro !== ""]
    ],
    10: []
  };
  return (req[n] || []).filter(function (r) { return !r[1]; }).map(function (r) { return r[0]; });
}

/* ===================== Render: blocos ===================== */
function selectHtml(field, options, selected, extraClass) {
  var html = '<select class="f-input' + (extraClass || "") + '" data-field="' + field + '"><option value="">Selecione</option>';
  options.forEach(function (opt) {
    var value = Array.isArray(opt) ? opt[0] : opt;
    var label = Array.isArray(opt) ? opt[1] : opt;
    html += '<option value="' + esc(value) + '"' + (selected === value ? " selected" : "") + '>' + esc(label) + '</option>';
  });
  return html + '</select>';
}

function simNaoSeg(field, value) {
  return '<div class="seg">' +
    '<button type="button" class="' + (value === true ? "on" : "") + '" data-action="set" data-key="' + field + '" data-val="true">Sim</button>' +
    '<button type="button" class="' + (value === false ? "on" : "") + '" data-action="set" data-key="' + field + '" data-val="false">Não</button>' +
    '</div>';
}

function moneyInput(field, label, extra) {
  return '<div' + (extra ? ' class="' + extra + '"' : "") + '><label class="f-label">' + esc(label) + '</label>' +
    '<input type="text" inputmode="numeric" class="f-input num" data-money="' + field + '" value="' + esc(fmt(data[field])) + '"></div>';

    } else if (status === "erro") {

/* ===================== Render principal ===================== */
function renderStepper() {
  var el = document.getElementById("stepper");
  if (step < 1 || step > 10) { el.style.display = "none"; return; }
  el.style.display = "flex";
  var html = "";
  for (var n = 1; n <= 10; n++) {
    var cls = n === step ? "active" : n < step ? "done" : "todo";
    html += '<div class="step-cell"><div class="step-node ' + cls + '">' + n + '</div>' + (n < 10 ? '<div class="step-line"></div>' : "") + '</div>';
  }
  el.innerHTML = html;
}

function render() {
  renderStepper();
  var app = document.getElementById("app");
  var html = "";
  if (step === 0) {
    html = renderStep0();
  } else if (step === 11) {
    html = renderDone();
  } else {
    var meta = STEP_META[step];
    html += '<div class="step-eyebrow"><div class="step-eyebrow-line"></div><div class="step-eyebrow-text">' + meta.eyebrow + '</div></div>' +
      '<div class="step-title">' + meta.title + '</div>' +
      '<div class="step-desc">' + meta.desc + '</div>';
    var renderers = { 1: renderStep1, 2: renderStep2, 3: renderStep3, 4: renderStep4, 5: renderStep5, 6: renderStep6, 7: renderStep7, 8: renderStep8, 9: renderStep9, 10: renderStep10 };
    html += renderers[step]();
    var missing = requiredByStep(step);
    var blocked = missing.length > 0;
    var showError = attempted[step] && blocked;
    // A mensagem de erro fica sempre no DOM, só escondida quando não há o que
    // mostrar: assim o atualizarRodape() consegue preenchê-la e limpá-la sem
    // depender de um novo render().
    html += '<div style="margin-top:36px;">' +
      '<div class="error-msg" id="erroEtapa"' + (showError ? '' : ' style="display:none;"') + '>' +
      (showError ? 'Preencha para continuar: ' + esc(missing.join(", ")) : '') + '</div>' +
      '<div class="footer-nav" style="margin-top:0;">' +
      '<button type="button" class="btn-back" data-action="back">← Voltar</button>' +
      '<button type="button" class="btn-continue' + (blocked ? " blocked" : "") + '" data-action="continue">' + (step === 10 ? "Finalizar" : "Continuar →") + '</button>' +
      '</div></div>';
  }
  app.innerHTML = html;
  bindEvents();
}

/* ===================== Eventos ===================== */
function scrollTop() { window.scrollTo({ top: 0 }); }

function coerceVal(v) { return v === "true" ? true : v === "false" ? false : v; }

var LIST_TEMPLATES = {
  outrasRendas: { descricao: "", valor: 0 },
  outrasDividas: { descricao: "", valor: 0 },
  outrasMetas: { descricao: "", valorEstimado: 0, prazo: "" },
  imoveis: { descricao: "", valorMercado: 0, status: "quitado", saldoDevedor: 0 },
  veiculos: { descricao: "", valor: 0, status: "quitado", saldoDevedor: 0 }
};

/**
 * Deixa o rodapé de acordo com o que já foi preenchido.
 *
 * O render() só roda quando a etapa muda. Digitar um valor atualiza os
 * totalizadores e nada mais, então o botão Continuar ficava com a
 * aparência de bloqueado mesmo depois de a etapa já estar válida — e a
 * mensagem de erro, uma vez exibida, continuava na tela depois de a
 * pessoa corrigir o campo. Clicar sempre funcionou; o que estava errado
 * era só o que a tela dizia.
 */
function atualizarRodape() {
  var botao = document.querySelector(".btn-continue");
  if (!botao) return;
  var missing = requiredByStep(step);
  botao.classList.toggle("blocked", missing.length > 0);

  var erro = document.getElementById("erroEtapa");
  if (!erro) return;
  if (attempted[step] && missing.length) {
    erro.textContent = "Preencha para continuar: " + missing.join(", ");
    erro.style.display = "";
  } else {
    erro.textContent = "";
    erro.style.display = "none";
  }
}

function bindEvents() {
  var app = document.getElementById("app");

  app.querySelectorAll("[data-field]").forEach(function (el) {
    var evt = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evt, function () {
      data[el.dataset.field] = el.value;
      persist();
      if (el.dataset.field === "dataNascimento") {
        var h = document.getElementById("hint-nascimento");
        if (h) h.innerHTML = idadeHint(data.dataNascimento);
      }
      if (el.dataset.field === "idadeAposentadoria") {
        var hp = document.getElementById("hint-prazo-aposentadoria");
        if (hp) hp.innerHTML = hintPrazoAposentadoria();
      }
      if (el.dataset.field === "dataNascimentoConjuge") {
        var hc = document.getElementById("hint-nascimento-conjuge");
        if (hc) hc.innerHTML = idadeHint(data.dataNascimentoConjuge);
      }
      if (el.dataset.field === "estado") {
        var cidade = document.getElementById("cidade-input");
        if (cidade) {
          cidade.disabled = !data.estado;
          cidade.placeholder = data.estado ? "Digite sua cidade" : "Selecione um estado primeiro";
        }
      }
    });
  });

  app.querySelectorAll("[data-money]").forEach(function (el) {
    el.addEventListener("input", function () {
      var v = parseCents(el.value);
      data[el.dataset.money] = v;
      el.value = fmt(v);
      persist();
      updateTotalizers();
    });
  });

  app.querySelectorAll("[data-despesa]").forEach(function (el) {
    el.addEventListener("input", function () {
      var v = parseCents(el.value);
      data.despesas[el.dataset.despesa] = v;
      el.value = fmt(v);
      persist();
      updateTotalizers();
    });
  });

  app.querySelectorAll("[data-ltext]").forEach(function (el) {
    el.addEventListener("input", function () {
      data[el.dataset.list][parseInt(el.dataset.index, 10)][el.dataset.ltext] = el.value;
      persist();
    });
  });

  app.querySelectorAll("[data-lmoney]").forEach(function (el) {
    el.addEventListener("input", function () {
      var v = parseCents(el.value);
      data[el.dataset.list][parseInt(el.dataset.index, 10)][el.dataset.lmoney] = v;
      el.value = fmt(v);
      persist();
      updateTotalizers();
    });
  });

  app.querySelectorAll("[data-range]").forEach(function (el) {
    el.addEventListener("input", function () {
      data[el.dataset.range] = parseInt(el.value, 10);
      persist();
      updateTotalizers();
    });
  });

  app.querySelectorAll("[data-action]").forEach(function (el) {
    var action = el.dataset.action;
    if (action === "toggleGastoNaoSei") {
      el.addEventListener("change", function () {
        data.gastoNaoSei = el.checked;
        persist();
        render();
      });
      return;
    }
    if (action === "toggleConsent") {
      el.addEventListener("change", function () {
        data.consentimento = el.checked;
        if (el.checked && !data.consentimentoEm) data.consentimentoEm = new Date().toISOString();
        if (!el.checked) data.consentimentoEm = "";
        persist();
      });
      return;
    }
    el.addEventListener("click", function () {
      switch (action) {
        case "start": step = 1; persist(); scrollTop(); render(); break;
        case "back": step = Math.max(0, step - 1); persist(); scrollTop(); render(); break;
        case "continue": {
          var missing = requiredByStep(step);
          if (missing.length === 0) {
            if (step === 10) {
              try { localStorage.setItem(STORAGE_DATA, JSON.stringify({ data: data, geradoEm: new Date().toISOString() })); } catch (e) {}
              if (window.hzSupabase) hzSupabase.novoEnvio(data.nome);
              step = 11;
            } else {
              step = Math.min(11, step + 1);
            }
            persist(); scrollTop(); render();
            if (step === 11) enviarRespostas();
          } else {
            attempted[step] = true;
            render();
          }
          break;
        }
        case "goto": step = parseInt(el.dataset.step, 10); persist(); scrollTop(); render(); break;
        case "set": data[el.dataset.key] = coerceVal(el.dataset.val); persist(); render(); break;
        case "setListField":
          data[el.dataset.list][parseInt(el.dataset.index, 10)][el.dataset.lfield] = coerceVal(el.dataset.val);
          persist(); render(); break;
        case "addItem":
          data[el.dataset.list].push(Object.assign({}, LIST_TEMPLATES[el.dataset.list]));
          persist(); render(); break;
        case "removeItem":
          data[el.dataset.list].splice(parseInt(el.dataset.index, 10), 1);
          persist(); render(); break;
        case "restart":
          if (confirm("Isso apaga todas as respostas salvas neste navegador. Deseja recomeçar?")) {
            try { localStorage.removeItem(STORAGE_FORM); localStorage.removeItem(STORAGE_DATA); } catch (e) {}
            step = 0; attempted = {}; data = defaultData();
            scrollTop(); render();
          }
          break;
      }
    });
  });
}

// Um ouvinte só, no container, ligado uma vez. Dentro do bindEvents() ele
// se acumularia a cada render. Como os handlers de cada campo rodam no alvo
// e este roda na propagação, os dados já estão atualizados quando ele entra.
(function ligarSincroniaDoRodape() {
  var app = document.getElementById("app");
  app.addEventListener("input", atualizarRodape);
  app.addEventListener("change", atualizarRodape);
})();

render();
</script>

<!-- ─────────────────────────────────────────────────────────────
     Controle de acesso ao Diagnóstico.

     Antes desta verificação, quem digitasse o endereço direto fazia
     o diagnóstico de R$ 97 inteiro de graça.

     Como liberar uma compra:
       Firebase > Firestore > enrollments > {uid da pessoa}
         > produtos > diagnostico > { ativo: true }

     Quando o checkout estiver ligado, o ideal é que o webhook do
     provedor de pagamento escreva esse documento sozinho, em vez de
     alguém fazer isso à mão a cada venda.
     ───────────────────────────────────────────────────────────── -->
<script type="module">
  // Deixe false para testar o questionário sem passar pelo login.
  const HZ_EXIGIR_COMPRA = true;

  // Se a verificação não responder nesse tempo, a pessoa recebe uma
  // explicação em vez de ficar olhando o spinner para sempre. Acontece
  // quando o Firebase está fora do ar ou quando um bloqueador de
  // anúncios barra o gstatic.com.
  const LIMITE_MS = 8000;

  const gate = document.getElementById('acessoGate');
  const spinner = document.getElementById('gateSpinner');
  const conteudo = document.getElementById('gateConteudo');
  let resolvido = false;

  function liberar() {
    resolvido = true;
    gate.hidden = true;
  }

  function bloquear(titulo, paragrafos, acoes) {
    resolvido = true;
    spinner.hidden = true;
    conteudo.innerHTML =
      '<h1 class="gate-titulo">' + titulo + '</h1>' +
      paragrafos.map(p => '<p class="gate-msg">' + p + '</p>').join('') +
      '<div class="gate-acoes">' + acoes + '</div>' +
      '<p class="gate-nota">Comprou e ainda está vendo esta tela? Escreva para ' +
      '<a href="mailto:elisa@hzinvest.com.br">elisa@hzinvest.com.br</a> ' +
      'que a gente libera na hora.</p>';
  }

  function semCompra() {
    bloquear(
      'Seu acesso ainda não está liberado',
      ['Você está conectado, mas não encontramos a compra do Diagnóstico Financeiro nesta conta.',
       'Se você comprou com outro e-mail, entre com ele. Se ainda não comprou, o diagnóstico completo está na página do produto.'],
      '<a class="gate-btn" href="diagnostico-lp.html">Ver o Diagnóstico Financeiro</a>' +
      '<a class="gate-btn sec" href="minha-area.html">Ir para a Minha Área</a>'
    );
  }

  function falhaDeConexao() {
    bloquear(
      'Não conseguimos verificar seu acesso',
      ['A checagem de login não respondeu. Isso costuma ser conexão instável ou uma extensão do navegador bloqueando o serviço de autenticação.',
       'Tente de novo. Se continuar, abra esta página numa aba anônima ou em outro navegador.'],
      '<button type="button" class="gate-btn" onclick="location.reload()">Tentar de novo</button>' +
      '<a class="gate-btn sec" href="index.html">Voltar ao site</a>'
    );
  }

  if (!HZ_EXIGIR_COMPRA) {
    liberar();
  } else {
    setTimeout(() => { if (!resolvido) falhaDeConexao(); }, LIMITE_MS);
    // import dinâmico: se o auth.js (ou o Firebase que ele carrega) não
    // subir, o catch avisa em vez de deixar a tela pendurada.
    import('./auth.js?v=2')
      .then(({ requireProduto }) => {
        requireProduto('diagnostico', { onLiberado: liberar, onSemCompra: semCompra });
      })
      .catch(err => {
        console.error('[HZ] Falha ao carregar a autenticação:', err);
        if (!resolvido) falhaDeConexao();
      });
  }
</script>
